<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Диспетчерская: симулятор железной дороги с ИИ-ассистентом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #E6EBEF; --panel: #F6F8FA; --panel-2: #EDF1F4; --ink: #1B242C; --muted: #5B6772; --line: #CBD3DA;
  --map: #DFE5EA; --grid: #D3DAE0; --track: #36414B; --track-dim: #8A96A0;
  --ai: #6447D6; --ai-btn: #6447D6; --ai-soft: rgba(100,71,214,.12); --sig-r: #D23A2B; --sig-y: #DE9A12; --sig-g: #2A9A57;
  --c-express: #B4307F; --c-passenger: #2460A6; --c-suburban: #0E8585; --c-freight: #7A5A3B;
  --reserve: rgba(222,154,18,.45); --bad: #C8352A; --warn: #B87708; --good: #23864C;
  --font: "Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --land: #EEF2EC; --water: #C9DCEB; --border: #9AA6A0;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12181D; --panel: #192128; --panel-2: #1F2931; --ink: #E2E8EC; --muted: #8C99A4; --line: #2B3640;
    --map: #0F1519; --grid: #182128; --track: #B4C0C9; --track-dim: #4E5B65;
    --ai: #9C86FF; --ai-btn: #5E45D0; --ai-soft: rgba(156,134,255,.16); --sig-r: #F0564A; --sig-y: #F2B533; --sig-g: #3FC57A;
    --c-express: #E05BAE; --c-passenger: #5C9BE8; --c-suburban: #2EC1BE; --c-freight: #C79B6D;
    --reserve: rgba(242,181,51,.4); --bad: #F0564A; --warn: #F2B533; --good: #3FC57A;
    --land: #172026; --water: #12283A; --border: #4A5862;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12181D; --panel: #192128; --panel-2: #1F2931; --ink: #E2E8EC; --muted: #8C99A4; --line: #2B3640;
  --map: #0F1519; --grid: #182128; --track: #B4C0C9; --track-dim: #4E5B65;
  --ai: #9C86FF; --ai-btn: #5E45D0; --ai-soft: rgba(156,134,255,.16); --sig-r: #F0564A; --sig-y: #F2B533; --sig-g: #3FC57A;
  --c-express: #E05BAE; --c-passenger: #5C9BE8; --c-suburban: #2EC1BE; --c-freight: #C79B6D;
  --reserve: rgba(242,181,51,.4); --bad: #F0564A; --warn: #F2B533; --good: #3FC57A;
  --land: #172026; --water: #12283A; --border: #4A5862;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; margin-right: 6px; white-space: nowrap; }
.brand svg { flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel-2); }
.seg button { border: 0; background: transparent; padding: 6px 11px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg.ai button[aria-pressed="true"] { background: var(--ai-btn); color: #fff; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 6px 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--track-dim); }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.ai { background: var(--ai-btn); color: #fff; border-color: var(--ai-btn); }
.btn.small { padding: 4px 8px; font-size: 13px; }
.btn.danger { color: var(--bad); }
select, input[type=number], input[type=text], input[type=time] { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 5px 7px; min-width: 0; }
.clock { font: 600 20px/1 var(--mono); letter-spacing: .02em; padding: 0 6px; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.lbl { color: var(--muted); font-size: 13px; }

.main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
.stage { position: relative; min-width: 0; min-height: 0; background: var(--map); overflow: hidden; touch-action: none; }
canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage.tool-add canvas { cursor: crosshair; }
.overlay { position: absolute; pointer-events: none; }
.ov-view { top: 10px; right: 10px; pointer-events: auto; display: flex; gap: 8px; align-items: center; }
.viewtag { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-weight: 600; font-size: 13px; }
.viewtag.on { border-color: var(--ai); color: var(--ai); }
.ov-zoom { right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
.ov-zoom button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 17px; }
.ov-legend { left: 10px; bottom: 10px; background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: calc(100% - 70px); }
.ov-legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.sw { width: 16px; height: 5px; border-radius: 3px; display: inline-block; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.ov-hint { top: 10px; left: 10px; background: var(--ink); color: var(--panel); border-radius: 8px; padding: 6px 10px; font-size: 13px; max-width: 60%; }
.card { top: 52px; left: 10px; width: 300px; max-width: calc(100% - 20px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; pointer-events: auto; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-height: calc(100% - 120px); overflow: auto; }
.card h3 { margin: 0 0 2px; font-size: 16px; }
.card .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; margin: 6px 0 8px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.x { position: absolute; top: 8px; right: 8px; border: 0; background: transparent; font-size: 18px; color: var(--muted); }
.why { background: var(--panel-2); border-left: 3px solid var(--warn); padding: 6px 8px; border-radius: 6px; font-size: 13px; margin: 6px 0; }
.why.ai { border-color: var(--ai); }
.why.bad { border-color: var(--bad); }

.side { border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { flex: 1 0 auto; border: 0; background: transparent; padding: 10px 5px; font-size: 13.5px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.pane { overflow: auto; padding: 12px 14px 24px; min-height: 0; }
.pane[hidden] { display: none; }
.pane h2 { font-size: 15px; margin: 18px 0 8px; }
.pane h2:first-child { margin-top: 2px; }
.pane p { margin: 6px 0; }
.note { color: var(--muted); font-size: 13px; }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tools button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 7px 4px; font-size: 12.5px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tools button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--panel); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.form label { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); }
.form label.full { grid-column: 1 / -1; }
.form label > * { color: var(--ink); }
.list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.list li { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--line); font-size: 13px; }
.list li:first-child { border-top: 0; }
.list li .grow { flex: 1; min-width: 0; }
.list li .t2 { color: var(--muted); font-size: 12px; }
.list li button { border: 0; background: transparent; color: var(--muted); font-size: 16px; padding: 0 4px; }
.list.click li { cursor: pointer; }
.list.click li:hover { background: var(--panel-2); }
.sev3 { border-left: 3px solid var(--bad); } .sev2 { border-left: 3px solid var(--warn); } .sev1 { border-left: 3px solid var(--track-dim); } .sev0 { border-left: 3px solid var(--ai); }
.empty { color: var(--muted); font-size: 13px; padding: 10px; border: 1px dashed var(--line); border-radius: 10px; }
.conf { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
.conf h4 { margin: 0 0 6px; font-size: 13.5px; }
.conf .row { margin-top: 6px; }
.conf select { flex: 1; min-width: 120px; }

table.cmp { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.cmp th, table.cmp td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; }
table.cmp th:first-child, table.cmp td:first-child { text-align: left; color: var(--muted); font-weight: 400; }
table.cmp thead th { font-size: 12px; color: var(--muted); font-weight: 500; }
table.cmp td.a { color: var(--ai); font-weight: 600; }
.verdict { background: var(--ai-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 13.5px; }
.chartbox { border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-top: 8px; }
.chartbox canvas { width: 100%; height: 170px; display: block; }
.chartkey { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.log li { padding: 4px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 62px 1fr; gap: 6px; }
.log time { font-family: var(--mono); color: var(--muted); font-size: 11.5px; padding-top: 1px; }
.log .bad { color: var(--bad); } .log .warn { color: var(--warn); } .log .hold { color: var(--ai); } .log .go { color: var(--good); } .log .error { color: var(--bad); font-weight: 600; } .log .route { color: var(--ai); }

/* окно кода */
.win { position: fixed; z-index: 50; top: 80px; right: 380px; width: 640px; height: 640px; min-width: 340px; min-height: 300px; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 48px rgba(0,0,0,.28); display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden; resize: both; }
.win[hidden] { display: none; }
.win-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--ai-btn); color: #fff; cursor: move; user-select: none; touch-action: none; }
.win-head b { flex: 1; font-weight: 600; }
.win-head button { border: 0; background: rgba(255,255,255,.18); color: #fff; border-radius: 6px; padding: 3px 8px; }
.win-tools { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
.win-tools select { max-width: 230px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.editor { display: grid; grid-template-columns: auto 1fr; min-height: 0; background: var(--panel-2); font: 12.5px/1.55 var(--mono); }
.gutter { padding: 8px 8px 8px 10px; color: var(--track-dim); text-align: right; overflow: hidden; user-select: none; white-space: pre; }
.editor textarea { border: 0; outline: 0; resize: none; background: transparent; padding: 8px 10px; font: inherit; tab-size: 2; white-space: pre; overflow: auto; min-height: 0; }
.win-foot { border-top: 1px solid var(--line); max-height: 40%; display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.win-foot .tabs button { padding: 6px; font-size: 12.5px; }
.console { overflow: auto; padding: 6px 10px; font: 12px/1.5 var(--mono); min-height: 70px; max-height: 150px; }
.console div { white-space: pre-wrap; }
.console .error { color: var(--bad); } .console .hold, .console .route { color: var(--ai); } .console .go { color: var(--good); } .console .ok { color: var(--good); }
.api { font-size: 12.5px; line-height: 1.5; }
.api code { font-family: var(--mono); font-size: 11.5px; background: var(--panel-2); padding: 1px 4px; border-radius: 4px; }
.api dl { margin: 0; } .api dt { margin-top: 6px; } .api dd { margin: 0 0 0 10px; color: var(--muted); }
.status { font-size: 12.5px; }
.status.ok { color: var(--good); } .status.err { color: var(--bad); }

@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .main { grid-template-columns: 1fr; grid-template-rows: 58vh auto; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .pane { max-height: none; }
  .win { left: 6px !important; right: 6px !important; top: auto !important; bottom: calc(6px + env(safe-area-inset-bottom, 0px)); width: auto !important; height: 70vh !important; resize: none; }
  .card { width: 260px; }
  .brand span { display: none; }
  .ov-legend { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
#scen { max-width: 240px; text-overflow: ellipsis; }
#lang, #theme { flex: none; }


/* ---- упрощённый интерфейс ---- */
.bar { gap: 12px; padding: 9px 14px; }
.transport { display: flex; align-items: center; gap: 8px; padding: 3px 4px 3px 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2); }
.play { border: 0; border-radius: 999px; padding: 7px 16px; font-weight: 600; background: var(--good); color: #fff; min-width: 104px; }
.play.on { background: var(--ink); color: var(--panel); }
.play:disabled { opacity: .45; }
.icon { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-size: 17px; line-height: 1; display: inline-grid; place-items: center; padding: 0; }
.transport .icon { border: 0; background: transparent; }
.transport select { border: 0; background: transparent; font-weight: 600; }
.clock { font-size: 18px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .knob { width: 38px; height: 22px; border-radius: 999px; background: var(--track-dim); position: relative; transition: background .15s; flex: none; }
.switch .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + .knob { background: var(--ai-btn); }
.switch input:checked + .knob::after { transform: translateX(16px); }
.switch input:focus-visible + .knob { outline: 2px solid var(--ai); outline-offset: 2px; }
.menu { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; width: 220px; display: grid; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.14); }
.pop[hidden] { display: none; }
.pop label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.pop label select { color: var(--ink); }
.viewlbl { font-size: 12.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.ov-legend { padding: 0; }
.ov-legend details { pointer-events: auto; }
.ov-legend summary { cursor: pointer; padding: 7px 12px; font-weight: 500; font-size: 12.5px; list-style: none; }
.ov-legend summary::-webkit-details-marker { display: none; }
.ov-legend summary::before { content: "ⓘ "; color: var(--muted); }
.ov-legend .lg { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 0 12px 9px; }
.ov-legend .lg span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.ov-legend { pointer-events: auto; }
.side { width: auto; }
.tabs { gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tabs button { border-radius: 8px; border-bottom: 0; padding: 7px 6px; }
.tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.pane { padding: 14px 16px 28px; }
.help { border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.help h3 { margin: 0 0 6px; font-size: 14.5px; }
.help ol { margin: 0 0 10px; padding-left: 20px; font-size: 13.5px; display: grid; gap: 4px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.kpi b { display: block; font-size: 22px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.kpi.bad b { color: var(--bad); }
.cap { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; }
.logd { margin-top: 16px; }
.logd summary, details.more summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 4px 0; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 11px 12px; display: grid; gap: 3px; }
.tile:hover { border-color: var(--track-dim); background: var(--panel-2); }
.tile i { font-style: normal; font-size: 20px; line-height: 1.2; }
.tile b { font-size: 13.5px; }
.tile span { font-size: 12px; color: var(--muted); }
.sitform { display: grid; gap: 10px; }
.sitform label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.sitform label > * { color: var(--ink); }
.sitform .go { justify-self: start; padding: 8px 16px; }
.back { border: 0; background: transparent; color: var(--muted); padding: 0; margin-bottom: 10px; font-size: 13px; }
.toast { background: var(--ai-soft); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
.toast:empty { display: none; }
.big2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.big2 .kpi.a { border-color: var(--ai); }
.big2 .kpi.a b { color: var(--ai); }
@media (max-width: 1100px) and (min-width: 901px) { .brand span { display: none; } }
.t-short, .m-only { display: none; }
@media (max-width: 900px) {
  html, body { height: 100%; }
  body { overflow: hidden; }
  .app { height: 100%; min-height: 0; grid-template-rows: auto minmax(0, 1fr); }
  .bar { flex-wrap: wrap; gap: 8px; padding: 8px 10px; }
  .brand { order: 1; margin: 0; } #scen { order: 2; flex: 1 1 0; min-width: 0; max-width: none; } .switch { order: 3; } #btnCode { order: 4; } .menu { order: 5; }
  .bar .spacer { display: none; }
  .transport { order: 6; flex: 1 1 100%; justify-content: space-between; }
  .t-long, .viewlbl { display: none; } .t-short { display: inline; }
  .m-only { display: inline-grid; }
  #btnCode { width: 38px; height: 38px; padding: 0; justify-content: center; }
  .play { min-width: 92px; padding: 8px 14px; }
  .clock { font-size: 16px; padding: 0 2px; }
  .main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 46%) minmax(0, 1fr); min-height: 0; }
  .main.mapbig { grid-template-rows: minmax(0, 78%) minmax(0, 1fr); }
  .side { border-left: 0; border-top: 1px solid var(--line); min-height: 0; overflow: hidden; }
  .pane { min-height: 0; padding: 12px 12px calc(20px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; }
  .tabs { padding: 6px 8px; } .tabs button { padding: 8px 4px; font-size: 13.5px; }
  .ov-view { top: 8px; right: 8px; } .ov-view .seg button { padding: 6px 9px; font-size: 12.5px; }
  .ov-zoom { right: 8px; bottom: 8px; } .ov-zoom button { width: 38px; height: 38px; }
  .ov-legend { display: block; left: 8px; bottom: 8px; max-width: calc(100% - 64px); }

  .win { position: fixed; inset: 0 !important; left: 0 !important; right: 0 !important; top: 0 !important; bottom: 0 !important; width: auto !important; height: auto !important; min-width: 0 !important; max-width: none !important; max-height: none !important; border-radius: 0; resize: none;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); display: flex; flex-direction: column; }

  .win .console { max-height: 26vh; }

  select, input[type=number], input[type=text], input[type=time] { font-size: 16px; }
}

/* ---- обстановка ---- */
.banner { display: grid; grid-template-columns: 34px 1fr; gap: 10px; border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; border: 1px solid var(--line); background: var(--panel-2); }
.banner .bi { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; background: var(--panel); }
.banner .bt { font-weight: 700; font-size: 15px; }
.banner .bx { font-size: 13px; margin-top: 2px; }
.banner .tip { margin-top: 6px; font-weight: 500; }
.banner .bv { font-size: 12px; color: var(--muted); margin-top: 6px; }
.banner.good { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); background: color-mix(in srgb, var(--good) 9%, var(--panel)); }
.banner.good .bi { color: var(--good); }
.banner.warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); background: color-mix(in srgb, var(--warn) 10%, var(--panel)); }
.banner.warn .bi { color: var(--warn); }
.banner.bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); background: color-mix(in srgb, var(--bad) 10%, var(--panel)); }
.banner.bad .bi { color: var(--bad); }
.kpis3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.kpis3 .kpi { padding: 8px 10px; }
.kpis3 .kpi b { font-size: 17px; white-space: nowrap; }
.grp { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
.grp summary { cursor: pointer; padding: 9px 12px; font-weight: 600; font-size: 13.5px; list-style: none; display: flex; gap: 6px; align-items: center; }
.grp summary::-webkit-details-marker { display: none; }
.grp summary::after { content: "▾"; margin-left: auto; color: var(--muted); transition: transform .15s; }
.grp:not([open]) summary::after { transform: rotate(-90deg); }
.grp.bad { border-left: 4px solid var(--bad); } .grp.warn { border-left: 4px solid var(--warn); } .grp.ai { border-left: 4px solid var(--ai); }
.grp ul { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow: auto; }
.grp li { padding: 8px 12px; border-top: 1px solid var(--line); cursor: pointer; font-size: 13px; }
.grp li:hover { background: var(--panel-2); }
.grp .r1 { display: flex; gap: 8px; align-items: baseline; }
.grp .ty { color: var(--muted); font-size: 12px; }
.grp .mn { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
.grp .r2 { color: var(--muted); font-size: 12px; }
.grp .r3 { font-size: 12.5px; margin-top: 2px; }
.recent { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.recent li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.recent li.none { grid-template-columns: 1fr; color: var(--muted); }
.recent time { color: var(--muted); font-variant-numeric: tabular-nums; }
.recent li.bad span { color: var(--bad); } .recent li.warn span { color: var(--warn); }
.spd { margin: 10px 0 6px; } .spd-l { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.spd .seg button { padding: 5px 9px; font-size: 12.5px; }
.why b { font-size: 12.5px; }
.log .drv, .recent .drv span { color: var(--ai); }
.rec .rr { display: grid; grid-template-columns: 118px 1fr; gap: 6px; font-size: 12.5px; margin-top: 3px; }
.rec .rk { color: var(--muted); }
.rec .rb, .why .rb { display: flex; gap: 6px; margin-top: 8px; }
.rec.done { opacity: .78; }
.grp li.none { cursor: default; color: var(--muted); }
.why .rr { display: grid; grid-template-columns: 110px 1fr; gap: 6px; font-size: 12px; margin-top: 3px; }
</style>
</head>

  'Демо: скрещение на разъезде': ['Демо: разъездтегі айқасу', 'Demo: a meet at a passing loop'],
  'Скорый №11 идёт по однопутному перегону Разъезд 47 – Коктал под предупреждением 60 км/ч (путевые работы) и позже освобождает перегон. Навстречу к разъезду подходит грузовой №2401. Без вмешательства грузовой останавливается у выходного сигнала разъезда и ждёт. ИИ рассчитывает момент освобождения перегона по хвосту скорого и предлагает машинисту грузового сниженную скорость, чтобы подойти к сигналу к моменту его открытия. На двухпутном перегоне Жетысу – Разъезд 47 встречные идут по своим путям и не мешают друг другу.': ['№11 жедел пойызы 47 разъезі – Көктал бір жолды аралығымен 60 км/сағ ескертуімен (жол жұмыстары) жүреді және аралықты кешірек босатады. Разъездке қарсы №2401 жүк пойызы келе жатыр. Араласусыз жүк пойызы разъездің шығу сигналында тоқтап, күтеді. ЖИ аралықтың жедел пойыз құйрығы бойынша босау сәтін есептеп, жүк пойызының машинисіне сигналға ашылу сәтінде жету үшін төмендетілген жылдамдықты ұсынады. Жетісу – 47 разъезі қос жолды аралығында қарсы пойыздар өз жолдарымен жүреді және бір-біріне кедергі келтірмейді.', 'Express №11 runs over the single-track section Siding 47 – Koktal under a 60 km/h restriction (track works) and clears it late. Freight №2401 approaches the siding from the other side. Left alone, the freight stops at the siding exit signal and waits. The AI works out when the tail of the express will clear the section and advises the freight driver to slow down so as to reach the signal as it clears. On the double-track section Zhetysu – Siding 47 opposing trains keep to their own tracks and do not get in each other\'s way.'],
  'Жетысу': ['Жетісу', 'Zhetysu'], 'Разъезд 47': ['47 разъезі', 'Siding 47'], 'Коктал': ['Көктал', 'Koktal'],
  'Демонстрация': ['Көрсетілім', 'Demo walkthrough'],
  'Нажмите «▶ Пуск». Через минуту ИИ предложит машинисту грузового №2401 снизить скорость — модель встанет на паузу.': ['«▶ Бастау» түймесін басыңыз. Бір минуттан кейін ЖИ №2401 жүк пойызының машинисіне жылдамдықты азайтуды ұсынады — модель үзіліске қойылады.', 'Press “▶ Run”. A minute later the AI will advise the driver of freight №2401 to slow down, and the model will pause.'],
  'Прочитайте причину, прогноз и экономию и нажмите «Принять».': ['Себебін, болжамды және үнемді оқып, «Қабылдау» түймесін басыңыз.', 'Read the reason, forecast and saving, then press “Accept”.'],
  'Переключите карту на «Без ассистента»: там №2401 останавливается у выходного сигнала разъезда и ждёт скорого №11.': ['Картаны «Ассистентсіз» күйіне ауыстырыңыз: онда №2401 разъездің шығу сигналында тоқтап, №11 жедел пойызын күтеді.', 'Switch the map to “Without assistant”: there №2401 stops at the siding exit signal and waits for express №11.'],

function findPath(net, from, to, avoid = []) {
  if (from === to) return { nodes: [from], edges: [] };
  const av = new Set(avoid);
  const adj = new Map();
  for (const n of net.nodes) adj.set(n.id, []);
  for (const e of net.edges) {
    if (av.has(e.id) || !adj.has(e.a) || !adj.has(e.b)) continue;
    const w = e.len / (e.vmax / 3.6);
    adj.get(e.a).push([e.b, w, e]);
    adj.get(e.b).push([e.a, w, e]);
  }
  const dist = new Map([[from, 0]]), prev = new Map(), done = new Set();
  while (true) {
    let u = null, best = Infinity;
    for (const [k, d] of dist) if (!done.has(k) && d < best) { best = d; u = k; }
    if (u === null) return null;
    if (u === to) break;
    done.add(u);
    for (const [v, w, e] of adj.get(u) || []) {
      const nd = best + w;
      if (nd < (dist.get(v) ?? Infinity)) { dist.set(v, nd); prev.set(v, [u, e]); }
    }
  }
  const nodes = [to], edges = [];
  let c = to;
  while (c !== from) { const [p, e] = prev.get(c); nodes.unshift(p); edges.unshift(e); c = p; }
  return { nodes, edges };
}

  // ---------- прогноз движения (та же физика, что в advance) ----------

  clearTime(edgeId, nodeId) {

    const towardF = e.b === nodeId; // встречные идут к nodeId
    const set = towardF ? e.inF : e.inR;
    const res = { clearAt: this.t, trains: [] };
    // встречные по порядку: ближний к узлу первым; следующий за ним не войдёт на станцию,
    // пока передний не освободит горловину (интервал попутного следования)
    const list = [];

      let j = -1;
      for (let i = o.seq.length - 1; i >= 0; i--) { const q = o.seq[i]; if (q.kind === 'block' && q.edgeId === edgeId && q.last) { j = i; break; } }
      if (j < 0) continue;

      if (cur != null) {

  // keep: число элементов seq, которые сохраняются (при перемаршрутизации)
  setPath(tr, p, keepCount, keepNodes) {
    const ty = tr.ty;

    let seq;
    if (keepCount > 0) {

  // ---------- горловины ----------
  setupThroats() {
    const P = (id) => this.nodeMap.get(id);
    for (const n of this.net.nodes) { n.ends = {}; n.throat = { W: [], E: [] }; }

    const vStop = d > 0 ? Math.sqrt(2 * ty.dec * 0.9 * d) : 0;
    let vt = Math.min(vlim, vAhead, vStop);
    if (broken || tr.state === 'dwell') vt = 0;
    const v0 = tr.v;
    if (tr.v < vt) {
      const a = ty.acc * Math.max(0.25, 1 - tr.v / ((ty.vmax / 3.6) * 1.15));
      tr.v = Math.min(vt, tr.v + a * dt);
    } else {
      tr.v = Math.max(vt, tr.v - ty.dec * (broken ? 1.5 : 1.3) * dt);
    }
    let ds = ((v0 + tr.v) / 2) * dt;
    if (tr.state !== 'dwell' && tr.s + ds >= target - 0.3) { ds = Math.max(0, target - tr.s); tr.v = 0; }
    tr.s += ds;
    // энергия: кинетическая + сопротивление движению
    if (tr.v > v0) tr.energy += (ty.mass * 1000 * (tr.v * tr.v - v0 * v0)) / 2 / 0.85 / 3.6e6;
    tr.energy += (ty.mass * 1000 * 0.0022 * 9.81 * ds) / 0.85 / 3.6e6;
    while (tr.headIdx < tr.resIdx && tr.s > tr.starts[tr.headIdx] + tr.seq[tr.headIdx].len) tr.headIdx++;
    const tail = tr.s - ty.len;
    while (tr.tailIdx < tr.headIdx && tail > tr.starts[tr.tailIdx] + tr.seq[tr.tailIdx].len) {
      this.releaseIdx(tr, tr.tailIdx); tr.tailIdx++;
    }
    if (this.routeMode) for (let i = tr.tailIdx; i <= tr.headIdx; i++) {
      const q = tr.seq[i];
      if (q.kind === 'node' && q.inRoute && tail > tr.starts[i] + THROAT_LEN) { this.dropRoute(this.nodeMap.get(q.nodeId), q.inRoute); q.inRoute = null; }
    }
    // прибытие на остановку
    if (tr.state === 'running' && ns !== -1 && tr.headIdx === ns && tr.v === 0 && Math.abs(tr.s - this.stopPos(tr, ns)) < 0.6) {
      tr.state = 'dwell'; tr.stopIdx = ns; tr.stopFlag = false;
      const delay = t - tr.arr[ns];
      tr.arrDelay = delay;
      const st = this.nodeMap.get(tr.seq[ns].nodeId);
      if (ns === tr.seq.length - 1) {
        tr.finalArrived = true;
        tr.dwellUntil = t + 120;
        this.m.completed++;
        this.m.arrDelaySum += Math.max(0, delay);
        if (delay <= 300) this.m.onTime++;
      } else {
        tr.dwellUntil = Math.max(t + (ty.dwell || 60), tr.tE[ns]) + tr.extraDwell;
        tr.extraDwell = 0;
      }
      if (delay > 300) this.ev(`${tr.name} прибыл на ст. ${st.name} с опозданием ${Math.round(delay / 60)} мин`, 'warn');
    }
    // учёт ожидания / вынужденных остановок
    if (tr.state === 'running' && tr.v === 0) {
      if (tr.waitSince == null) tr.waitSince = t;
      if (!tr.stopFlag && !broken) {
        tr.stopFlag = true; tr.unplanned++; this.m.unplanned++;
      }
    } else if (tr.v > 0.5) { tr.stopFlag = false; tr.waitSince = null; }
    else if (tr.state === 'dwell') tr.waitSince = null;
  }

  liveDelay(tr) {
    if (tr.state === 'pending') return Math.max(0, this.t - (tr.dep + 0)) ;
    if (tr.state === 'done' || tr.state === 'invalid') return Math.max(0, tr.arrDelay || 0);
    const i = tr.headIdx;
    const r = tr.seq[i];
    const frac = Math.min(1, Math.max(0, (tr.s - tr.starts[i]) / r.len));
    let sched = tr.tS[i] + frac * (tr.tE[i] - tr.tS[i]);
    if (tr.state === 'dwell') sched = tr.tE[i];
    if (tr.finalArrived) return Math.max(0, tr.arrDelay);
    return Math.max(0, this.t - sched);
  }

  edgeName(e) { return `${this.nodeMap.get(e.a).name} – ${this.nodeMap.get(e.b).name}`; }

  eta(tr, nodeId) {
    if (tr.state === 'done' || tr.state === 'invalid') return null;
    const startIdx = tr.state === 'pending' ? 0 : tr.headIdx;
    let j = -1;
    for (let i = startIdx; i < tr.seq.length; i++) if (tr.seq[i].kind === 'node' && tr.seq[i].nodeId === nodeId) { j = i; break; }
    if (j === -1) return null;
    let T = tr.state === 'pending' ? Math.max(0, tr.dep + tr.extraDelay - this.t) : 0;
    if (tr.state === 'dwell') T += Math.max(0, tr.dwellUntil - this.t);
    if (tr.state !== 'pending' && j === tr.headIdx) return T;
    const s0 = tr.state === 'pending' ? 0 : tr.s;
    for (let i = startIdx; i < j; i++) {
      const r = tr.seq[i];
      const a = Math.max(tr.starts[i], s0), b = tr.starts[i] + r.len;
      if (b <= a) continue;
      const v = (Math.min(tr.ty.vmax, r.vmax) / 3.6) * 0.92;
      T += (b - a) / v;
      if (r.kind === 'node' && r.stop && i > tr.lastDep && i > startIdx) T += tr.ty.dwell || 60;
    }
    return T;
  }

  reroute(tr, nodes) {
    if (!Array.isArray(nodes) || nodes.length < 2) return false;
    if (tr.state === 'done' || tr.state === 'invalid') return false;
    const edges = [];
    for (let i = 0; i < nodes.length - 1; i++) {
      const e = this.net.edges.find((x) => (x.a === nodes[i] && x.b === nodes[i + 1]) || (x.b === nodes[i] && x.a === nodes[i + 1]));
      if (!e || !this.nodeMap.has(nodes[i + 1])) return false;
      edges.push(e);
    }
    if (nodes[nodes.length - 1] !== tr.to) return false;
    if (tr.state === 'pending') {
      if (nodes[0] !== tr.from) return false;
      this.setPath(tr, { nodes, edges }, 0, null);
    } else {
      const fr = tr.seq[tr.resIdx];
      if (fr.kind !== 'node' || fr.nodeId !== nodes[0]) return false;
      const same = tr.pathNodes.slice(fr.pi).join(',') === nodes.join(',');
      if (same) return false;
      this.setPath(tr, { nodes, edges }, tr.resIdx + 1, tr.pathNodes.slice(0, fr.pi + 1));
    }
    this.m.reroutes++;
    return true;
  }

  // ---------- конфликты ----------
  breakTrain(id, min) {
    const tr = this.trainMap.get(id); if (!tr || tr.state === 'done') return;
    tr.brokenUntil = this.t + min * 60;
    this.ev(`Неисправность: ${tr.name} остановлен на ${min} мин`, 'bad');
  }
  setManualCap(id, kmh) {
    const tr = this.trainMap.get(id); if (!tr || tr.state === 'done') return;
    tr.manualCap = kmh ? +kmh : null;
    this.ev(kmh ? `Диспетчер: ${tr.name} — не выше ${kmh} км/ч` : `Диспетчер снял ограничение скорости ${tr.name}`, 'warn');
  }
  delayTrain(id, min) {
    const tr = this.trainMap.get(id); if (!tr || tr.state === 'done') return;
    if (tr.state === 'pending') tr.extraDelay += min * 60;
    else if (tr.state === 'dwell') tr.dwellUntil += min * 60;
    else tr.extraDwell += min * 60;
    this.ev(`Задержка: ${tr.name} +${min} мин`, 'warn');
  }
  // track: 'f' | 'r' — один путь двухпутного перегона; иначе весь перегон
  closeEdge(id, min, track) {
    const e = this.edgeMap.get(id); if (!e) return;
    if (e.double && (track === 'f' || track === 'r')) {
      e.trk[track].closedUntil = this.t + min * 60;
      const o = track === 'f' ? 'r' : 'f';
      this.ev(`Путь ${TRACK_NAME[track]} перегона ${this.edgeName(e)} закрыт на ${min} мин`, 'bad');
      return;
    }
    e.closedUntil = this.t + min * 60;
    this.ev(`Перегон ${this.edgeName(e)} закрыт на ${min} мин`, 'bad');
  }
  // приказ диспетчера: движение по пути lane в обе стороны (на время закрытия соседнего пути)
  orderWrongLine(id, lane, vmax) {
    const e = this.edgeMap.get(id);
    if (!e || !e.double || (lane !== 'f' && lane !== 'r')) return { ok: false, why: 'перегон не двухпутный' };
    const o = lane === 'f' ? 'r' : 'f';
    if (this.trackClosed(e, lane)) return { ok: false, why: `путь ${TRACK_NAME[lane]} закрыт` };
    if (!this.trackClosed(e, o)) return { ok: false, why: `путь ${TRACK_NAME[o]} не закрыт — приказ не нужен` };
    const k = e.trk[lane];
    const a = this.nodeMap.get(e.a), b = this.nodeMap.get(e.b);
    for (const n of [a, b]) if (!n.crossovers) return { ok: false, why: `на ст. ${n.name} нет съезда между главными путями` };
    if (!k.bidir && !(+vmax > 0)) return { ok: false, why: 'без двусторонней АБ в приказе нужно указать скорость' };
    k.order = { since: this.t, vmax: k.bidir ? null : +vmax };
    this.ev(`Приказ: движение по пути ${TRACK_NAME[lane]} перегона ${this.edgeName(e)} в обе стороны — ${k.bidir ? 'по сигналам двусторонней АБ' : `один поезд на перегоне${k.order.vmax ? `, не более ${k.order.vmax} км/ч` : ''}`}`, 'warn');
    return { ok: true };
  }
  cancelWrongLine(id, lane) {
    const e = this.edgeMap.get(id); if (!e || !e.double || !e.trk[lane] || !e.trk[lane].order) return;
    e.trk[lane].order = null;
    this.ev(`Приказ отменён: путь ${TRACK_NAME[lane]} перегона ${this.edgeName(e)} — только в правильном направлении`, 'info');
  }
  speedRestrict(id, kmh, min, track) {
    const e = this.edgeMap.get(id); if (!e) return;
    if (e.double && (track === 'f' || track === 'r')) {
      e.trk[track].tsr = kmh; e.trk[track].tsrUntil = this.t + min * 60;
      this.ev(`Предупреждение: путь ${TRACK_NAME[track]} ${this.edgeName(e)} — ${kmh} км/ч на ${min} мин`, 'warn');
      return;
    }
    e.tsr = kmh; e.tsrUntil = this.t + min * 60;
    this.ev(`Предупреждение: ${this.edgeName(e)} — ${kmh} км/ч на ${min} мин`, 'warn');
  }
  absFail(id, min, track) {
    const e = this.edgeMap.get(id); if (!e) return;
    if (e.double && (track === 'f' || track === 'r')) {
      e.trk[track].absFailUntil = this.t + min * 60;
      this.ev(`Отказ автоблокировки на пути ${TRACK_NAME[track]} ${this.edgeName(e)} на ${min} мин`, 'bad');
      return;
    }
    e.absFailUntil = this.t + min * 60;
    this.ev(`Отказ автоблокировки ${this.edgeName(e)} на ${min} мин`, 'bad');
  }

  detectDeadlocks() {
    // Тупик: множество стоящих поездов, ни один из которых не может двинуться,
    // пока стоят остальные (ожидание станционного пути — «любой освободит»,
    // блок-участка и встречного направления — «все должны освободить»).
    const D = new Set();
    for (const tr of this.trains) {
      if ((tr.state === 'running' || tr.state === 'pending') && tr.v === 0 && tr.waitFor.length &&
          !(tr.waitReason && tr.waitReason.startsWith('задержан')) && this.t >= tr.brokenUntil) D.add(tr.id);
    }
    let changed = true;
    while (changed) {
      changed = false;
      for (const id of [...D]) {
        const tr = this.trainMap.get(id);
        const wf = tr.waitFor.filter((x) => x !== id);
        const free = tr.waitMode === 'or' ? wf.some((x) => !D.has(x)) : wf.every((x) => !D.has(x));
        if (free) { D.delete(id); changed = true; }
      }
    }
    this.deadSince = this.deadSince || new Map();
    const fresh = [];
    for (const tr of this.trains) {
      if (!D.has(tr.id)) { this.deadSince.delete(tr.id); tr.deadlock = false; continue; }
      if (!this.deadSince.has(tr.id)) this.deadSince.set(tr.id, this.t);
      const was = tr.deadlock;
      tr.deadlock = this.t - this.deadSince.get(tr.id) >= 15;
      if (tr.deadlock && !was) fresh.push(tr);
    }
    if (fresh.length) {
      const prevStuck = this.trains.some((t) => t.deadlock && !fresh.includes(t));
      if (!prevStuck) this.m.deadlocks++;
      this.ev(`ТУПИК: ${fresh.map((t) => t.name).join(', ')} — движение невозможно без вмешательства`, 'bad');
    }
  }

  // ---------- состояние для ассистента ----------
  snapshot() {
    const trains = [], nodes = [], edges = [];
    const byId = { trains: {}, nodes: {}, edges: {} };
    for (const n of this.net.nodes) {
      const r = this.res.get('N:' + n.id);
      const o = { id: n.id, name: _tr(n.name), type: n.type, tracks: n.type === 'station' ? n.tracks : 1, crossovers: n.crossovers, wrongEntry: n.wrongEntry,
        trackList: n.trackOcc ? n.trackOcc.map((id, k) => ({ index: k, name: n.trackName[k], main: n.trackMain[k], occupiedBy: id })) : null,
        throat: n.throat ? { W: n.throat.W.map((r) => ({ train: r.tr, kind: r.kind })), E: n.throat.E.map((r) => ({ train: r.tr, kind: r.kind })) } : null,
        trains: r ? [...r.occ] : [], inbound: [] };
      o.free = o.tracks - o.trains.length;
      nodes.push(o); byId.nodes[n.id] = o;
    }
    for (const e of this.net.edges) {
      const o = { id: e.id, a: e.a, b: e.b, name: _tr(this.edgeName(e)), lengthKm: e.len / 1000, vmax: this.edgeV(e),
        double: !!e.double, closed: this.t < e.closedUntil, closedForSec: Math.max(0, e.closedUntil - this.t),
        absFail: this.t < e.absFailUntil, trainsAB: [...e.inF], trainsBA: [...e.inR] };
      if (e.double) {
        const tv = (ln) => { const k = e.trk[ln]; return { name: TRACK_NAME[ln], dir: ln === 'f' ? 'AB' : 'BA',
          closed: this.trackClosed(e, ln), closedForSec: Math.max(0, Math.max(e.closedUntil, k.closedUntil) - this.t),
          absFail: this.t < k.absFailUntil || o.absFail, tsr: k.tsr && this.t < k.tsrUntil ? k.tsr : null,
          bidirectional: k.bidir, wrongLineOrder: k.order ? { vmax: k.order.vmax, since: k.order.since } : null,
          trainsAB: [...k.users.f], trainsBA: [...k.users.r] }; };
        o.tracks = { I: tv('f'), II: tv('r') };
        o.closed = o.tracks.I.closed && o.tracks.II.closed;
        o.closedForSec = o.closed ? Math.min(o.tracks.I.closedForSec, o.tracks.II.closedForSec) : 0;
        // однопутный режим — только когда один путь закрыт И по второму приказом организовано движение в обе стороны
        o.singleLineWorking = (o.tracks.I.closed && !!o.tracks.II.wrongLineOrder) || (o.tracks.II.closed && !!o.tracks.I.wrongLineOrder);
        // для логики ассистента перегон с одним закрытым путём работает как однопутный
        o.physicalDouble = true;
        if (o.singleLineWorking) o.double = false;
      }
      edges.push(o); byId.edges[e.id] = o;
    }
    for (const tr of this.trains) {
      if (tr.state === 'invalid') continue;
      const active = tr.state !== 'pending' && tr.state !== 'done';
      const head = active ? tr.seq[tr.headIdx] : null;
      const fr = active ? tr.seq[tr.resIdx] : tr.seq[0];
      let frontierNode = fr.kind === 'node' ? fr.nodeId : null;
      if (tr.state === 'done') frontierNode = null;
      let nextEdge = null;
      const lastIdx = active ? tr.resIdx : 0;
      if (frontierNode && lastIdx < tr.seq.length - 1) {
        const nb = tr.seq[lastIdx + 1];
        const e = this.edgeMap.get(nb.edgeId);
        const slw = e.double && ((this.trackClosed(e, 'f') && e.trk.r.order) || (this.trackClosed(e, 'r') && e.trk.f.order));
        nextEdge = { id: e.id, toNode: nb.dir === 'f' ? e.b : e.a, double: !!e.double && !slw };
      }
      const committed = [];
      if (active) {
        for (let i = tr.headIdx + 1; i <= tr.resIdx; i++) if (tr.seq[i].kind === 'node') committed.push(tr.seq[i].nodeId);
        const f = tr.seq[tr.resIdx];
        if (f.kind === 'block') committed.push(tr.pathNodes[f.pi + 1]);
      }
      for (const nid of committed) if (byId.nodes[nid]) byId.nodes[nid].inbound.push(tr.id);
      const routePos = active ? fr.pi : 0;
      const ns = this.nextStopIdx(tr);
      const status = tr.state === 'done' ? 'done' : tr.state === 'pending' ? 'pending'
        : this.t < tr.brokenUntil ? 'broken' : tr.state === 'dwell' ? 'dwell' : tr.v === 0 ? 'stopped' : 'running';
      // ближайшая станция впереди (независимо от заданного маршрута) и точка остановки
      let nextStation = null, stopDist = null, stopPlanned = false;
      if (active) {
        for (let i = tr.headIdx + 1; i < tr.seq.length; i++) {
          const q = tr.seq[i];
          if (q.kind === 'node' && q.station) { nextStation = { id: q.nodeId, distM: Math.round(this.stopPos(tr, i) - tr.s), stop: !!q.stop || i === tr.seq.length - 1 }; break; }
        }
        stopPlanned = ns !== -1 && ns <= tr.resIdx;
        stopDist = Math.round((stopPlanned ? this.stopPos(tr, ns) : this.stopPos(tr, tr.resIdx)) - tr.s);
      }
      const o = {
        id: tr.id, name: tr.name, type: tr.type, priority: tr.prio, maxSpeed: tr.ty.vmax, status,
        aspect: this.aspect(tr),
        nextStation, stopDist, stopPlanned, blocked: tr.state === 'running' && !!tr.waitReason, blockedBy: (tr.waitFor || []).slice(),
        speedCap: tr.speedCap, capReason: tr.capReason, manualCap: tr.manualCap, lengthM: tr.ty.len,
        speed: Math.round(tr.v * 3.6), from: tr.from, to: tr.to,
        route: tr.pathNodes.slice(), routeEdges: tr.pathEdges.slice(), routePos,
        atNode: head && head.kind === 'node' ? head.nodeId : null,
        onEdge: head && head.kind === 'block' ? head.edgeId : null,
        frontierNode, nextEdge, committed,
        nextStop: ns !== -1 ? tr.seq[ns].nodeId : null,
        delayMin: +(this.liveDelay(tr) / 60).toFixed(1),
        waitReason: tr.waitReason && _tr(tr.waitReason), waitingSec: tr.waitSince != null ? Math.round(this.t - tr.waitSince) : 0,
        deadlock: tr.deadlock, held: !!tr.hold, holdReason: tr.hold ? tr.hold.reason : null,
        departIn: tr.state === 'dwell' ? Math.max(0, tr.dwellUntil - this.t) : tr.state === 'pending' ? Math.max(0, tr.dep + tr.extraDelay - this.t) : 0,
      };
      trains.push(o); byId.trains[tr.id] = o;
    }
    const conflicts = this.issues().map((x) => ({ type: x.type, text: x.text, trains: x.trains || [], edge: x.edge || null }));
    return {
      time: this.t, clock: fmtClock(this.t), trains, nodes, edges, byId, conflicts,
      edgeBetween: (a, b) => edges.find((e) => (e.a === a && e.b === b) || (e.a === b && e.b === a)) || null,
    };
  }

  // приказ действует, пока соседний путь закрыт; после открытия и ухода последнего поезда — снимается
  expireOrders() {
    for (const e of this.net.edges) {
      if (!e.double) continue;
      for (const ln of ['f', 'r']) {
        const k = e.trk[ln]; if (!k.order) continue;
        const o = ln === 'f' ? 'r' : 'f';
        if (!this.trackClosed(e, o) && k.users[o].size === 0) {
          k.order = null;
          this.ev(`Путь ${TRACK_NAME[o]} перегона ${this.edgeName(e)} открыт: движение по пути ${TRACK_NAME[ln]} — только в правильном направлении`, 'info');
        }
      }
    }
  }
  issues() {
    const out = [];
    const dl = this.trains.filter((tr) => tr.deadlock);
    if (dl.length) out.push({ type: 'deadlock', sev: 3, text: `Тупик: ${dl.map((t) => t.name).join(', ')}`, trains: dl.map((t) => t.id) });
    for (const tr of this.trains) {
      if (tr.state === 'done' || tr.state === 'invalid') continue;
      if (this.t < tr.brokenUntil) out.push({ type: 'breakdown', sev: 2, text: `${tr.name}: неисправность, ещё ${Math.ceil((tr.brokenUntil - this.t) / 60)} мин`, trains: [tr.id] });
      else if (!tr.deadlock && tr.waitSince != null && this.t - tr.waitSince > 120 && tr.waitReason)
        out.push({ type: tr.hold ? 'held' : 'waiting', sev: tr.hold ? 0 : 1, text: `${tr.name} стоит ${Math.round((this.t - tr.waitSince) / 60)} мин: ${tr.waitReason}`, trains: [tr.id] });
    }
    for (const e of this.net.edges) {
      if (this.t < e.closedUntil) out.push({ type: 'closed', sev: 2, text: `Закрыт перегон ${this.edgeName(e)} (ещё ${Math.ceil((e.closedUntil - this.t) / 60)} мин)`, edge: e.id });
      if (this.t < e.absFailUntil) out.push({ type: 'absfail', sev: 1, text: `Отказ АБ ${this.edgeName(e)}`, edge: e.id });
      if (e.tsr && this.t < e.tsrUntil) out.push({ type: 'tsr', sev: 1, text: `Ограничение ${e.tsr} км/ч: ${this.edgeName(e)}`, edge: e.id });
      if (e.double) for (const ln of ['f', 'r']) {
        const k = e.trk[ln], N = TRACK_NAME[ln];
        if (this.t < k.closedUntil) {
          out.push({ type: 'closed', sev: 2, text: `Закрыт путь ${N} перегона ${this.edgeName(e)} (ещё ${Math.ceil((k.closedUntil - this.t) / 60)} мин)`, edge: e.id });
          const o = ln === 'f' ? 'r' : 'f';
          if (!e.trk[o].order) {
            const w = this.trains.filter((t) => t.waitReason && t.waitReason.startsWith(`путь ${N} закрыт;`)).length;
            if (w) out.push({ type: 'closed', sev: 2, text: `${w} поезд(ов) ждут: движение по пути ${TRACK_NAME[o]} перегона ${this.edgeName(e)} в обе стороны не организовано`, edge: e.id });
          }
        }
        if (k.order) out.push({ type: 'tsr', sev: 1, text: `По пути ${N} перегона ${this.edgeName(e)} — движение в обе стороны по приказу`, edge: e.id });
        if (this.t < k.absFailUntil) out.push({ type: 'absfail', sev: 1, text: `Отказ АБ на пути ${N}: ${this.edgeName(e)}`, edge: e.id });
        if (k.tsr && this.t < k.tsrUntil) out.push({ type: 'tsr', sev: 1, text: `Ограничение ${k.tsr} км/ч на пути ${N}: ${this.edgeName(e)}`, edge: e.id });
      }
    }
    return out.sort((a, b) => b.sev - a.sev);
  }

  // ---------- рекомендации ----------
  recAction(type, tr, params) {
    const n = tr.capInfo && tr.capInfo.untilNode ? this.nodeMap.get(tr.capInfo.untilNode) : null;
    if (type === 'speed') return `Машинисту ${tr.name}: снизить скорость до ${params.kmh} км/ч`;
    if (type === 'hold') { const f = tr.seq && tr.seq[tr.resIdx]; const st = f && f.kind === 'node' ? this.nodeMap.get(f.nodeId).name : null; return st ? `Удержать ${tr.name} на ст. ${st}` : `Удержать ${tr.name}`; }
    if (type === 'route') return `Изменить маршрут ${tr.name}: ${params.nodes.map((x) => this.nodeMap.get(x).name).join(' → ')}`;
    return type;
  }
  recNew(type, tr, params, info, status, apply, safety) {
    const r = { id: 'R' + this.recSeq++, key: type + ':' + tr.id, type, train: tr.id, trainName: tr.name, params, info: info || {},
      status, auto: status !== 'pending', safety: !!safety, createdAt: this.t, updatedAt: this.t, decidedAt: status !== 'pending' ? this.t : null,
      action: this.recAction(type, tr, params), apply };
    this.recs.push(r); this.recByKey.set(r.key, r);
    if (this.recs.length > 400) this.recs.splice(0, this.recs.length - 400);
    if (status === 'active') this.recActivate(r);
    if (status === 'pending' && this.onRec) this.onRec(r);
    return r;
  }
  recRecord(type, tr, params, info) { this.recNew(type, tr, params, info, 'active', null, false).status = 'done'; }
  recPropose(type, tr, params, info, apply, safety) {
    const key = type + ':' + tr.id; this._touched && this._touched.add(key);
    let r = this.recByKey.get(key);
    const same = r && JSON.stringify(r.params) === JSON.stringify(params);
    const live = r && (r.status === 'active' || r.status === 'pending');
    if (this.approval === 'auto' || safety) {
      apply();
      if (!live || !same || r.status === 'pending') { if (r && r.status === 'pending') r.status = 'replaced'; this.recNew(type, tr, params, info, 'active', apply, safety); }
      else r.info = info;
      return true;
    }
    if (r && r.status === 'rejected' && same && this.t - r.decidedAt < 300) return false;
    if (r && r.status === 'active' && same) { r.info = info; apply(); return true; }
    if (r && r.status === 'pending' && same) { r.info = info; r.updatedAt = this.t; return 'pending'; }
    if (r && r.status === 'pending') r.status = 'replaced';
    this.recNew(type, tr, params, info, 'pending', apply, false);
    return 'pending';
  }
  recWithdraw(type, trainId) {
    const r = this.recByKey.get(type + ':' + trainId);
    if (!r) return;
    if (r.status === 'pending') { r.status = 'expired'; r.decidedAt = this.t; }
    else if (r.status === 'active') { r.status = 'done'; r.endedAt = this.t; }
  }
  recSweep() {
    for (const r of this.recs) if (r.status === 'pending' && !this._touched.has(r.key) && this.t - r.updatedAt > 3) { r.status = 'expired'; r.decidedAt = this.t; }
  }
  recDecide(id, accept) {
    const r = this.recs.find((x) => x.id === id); if (!r || r.status !== 'pending') return false;
    r.decidedAt = this.t;
    if (!accept) { r.status = 'rejected'; this.alog(`Диспетчер отклонил: ${r.action}`, 'info'); return true; }
    r.status = 'active'; if (r.apply) r.apply(); this.recActivate(r);
    this.alog(`Диспетчер принял: ${r.action}`, 'go');
    return true;
  }
  // прогноз в момент исполнения — потом он сравнивается с фактом
  recActivate(r) {
    const tr = this.trainMap.get(r.train);
    if (r.type === 'speed' && tr && r.info && r.info.untilNode) {
      const p = this.planApproach(tr, r.info.untilNode);
      if (p && p.best) r.forecast = { P: p.P, passAt: p.best.passP, stop: !!p.needStop, node: r.info.untilNode, withoutStopSec: p.base ? p.base.stopSec : null };
    }
  }
  recWatch() {
    for (const r of this.recs) {
      if (!r.forecast || r.outcome || (r.status !== 'active' && r.status !== 'done')) continue;
      const tr = this.trainMap.get(r.train); if (!tr) continue;
      if (tr.state === 'running' && tr.v === 0 && tr.s < r.forecast.P + 5) r.stopped = true;
      if (tr.s >= r.forecast.P + 5 || tr.state === 'done') {
        r.outcome = { passAt: this.t, stopped: !!r.stopped, errSec: Math.round(this.t - r.forecast.passAt) };
        if (r.status === 'active') r.status = 'done';
      }
    }
  }

  runAssistant() {
    const state = this.snapshot();
    const self = this;
    const api = {
      memory: this.memory,
      hold(id, reason = 'решение ассистента') {
        const tr = self.trainMap.get(id); if (!tr || tr.state === 'done') return false;
        reason = String(reason).slice(0, 120);
        if (!tr.hold) { self.m.holds++; self.alog(`Диспетчеру: задержать ${tr.name} — ${reason}`, 'hold'); }
        tr.hold = { reason, since: tr.hold ? tr.hold.since : self.t };
        return true;
      },
      release(id) {
        const tr = self.trainMap.get(id); if (!tr || !tr.hold) return false;
        self.alog(`Диспетчеру: отправить ${tr.name} (ждал ${Math.round((self.t - tr.hold.since) / 60)} мин)`, 'go');
        tr.hold = null; return true;
      },
      setPriority(id, p) { const tr = self.trainMap.get(id); if (tr && tr.prio !== +p) { tr.prio = +p; self.alog(`Приоритет ${tr.name} → ${p}`); } },
      limitSpeed(id, kmh, reason = '') {
        const tr = self.trainMap.get(id); if (!tr || tr.state === 'done') return false;
        let info = null;
        if (reason && typeof reason === 'object') { info = reason; reason = info.reason || ''; }
        if (kmh == null) { tr.speedCap = null; tr.capReason = null; tr.capEndS = null; return true; }
        if (info && info.untilNode) {
          const k = tr.seq.findIndex((q, j) => j > tr.headIdx && q.kind === 'node' && q.nodeId === info.untilNode);
          if (k > 0) tr.capEndS = self.stopPos(tr, k);
        }
        tr.capInfo = info;
        kmh = Math.round(Math.max(10, Math.min(tr.ty.vmax, +kmh)));
        const la = tr.lastAdv;
        if (!la || Math.abs(la.kmh - kmh) >= 10 || self.t - la.t > 300) {
          tr.lastAdv = { kmh, t: self.t };
          self.m.advices++;
          self.alog(`Машинисту ${tr.name}: не выше ${kmh} км/ч${reason ? ' — ' + String(reason).slice(0, 120) : ''}`, 'drv');
        }
        tr.speedCap = kmh; tr.capReason = reason ? String(reason).slice(0, 120) : null;
        return true;
      },
      reroute(id, nodes) {
        const tr = self.trainMap.get(id); if (!tr) return false;
        const ok = self.reroute(tr, nodes);
        if (ok) self.alog(`Новый маршрут ${tr.name}: ${nodes.map((n) => self.nodeMap.get(n).name).join(' → ')}`, 'route');
        return ok;
      },
      findPath(from, to, opt = {}) { const p = findPath(self.net, from, to, opt.avoid || []); return p ? p.nodes : null; },
      pathTime(nodes, trainId) {
        const tr = self.trainMap.get(trainId); const vt = tr ? tr.ty.vmax : 120; let T = 0;
        for (let i = 0; i < nodes.length - 1; i++) {
          const e = state.edgeBetween(nodes[i], nodes[i + 1]); if (!e) return Infinity;
          T += (e.lengthKm * 1000) / (Math.min(vt, e.vmax) / 3.6);
        }
        return T;
      },
      eta(id, nodeId) { const tr = self.trainMap.get(id); return tr ? self.eta(tr, nodeId) : null; },
      // физический прогноз: через сколько секунд хвост последнего встречного освободит перегон в сторону узла
      clearTime(edgeId, nodeId) {
        const r = self.clearTime(edgeId, nodeId); if (!r) return null;
        return { inSec: r.clearAt == null ? null : Math.round(r.clearAt - self.t), trains: r.trains.map((x) => ({ id: x.id, inSec: x.at == null ? null : Math.round(x.at - self.t), uncertain: x.uncertain })) };
      },
      // режим подхода к станции: рекомендуемая скорость, точка начала торможения, экономия
      planApproach(id, nodeId) {
        const tr = self.trainMap.get(id); if (!tr) return null;
        const p = self.planApproach(tr, nodeId); if (!p) return null;
        const rel = (x) => (x == null ? null : Math.round(x - self.t));
        return { nodeId: p.nodeId, conflictEdge: p.conflict, distM: p.distM, clearInSec: rel(p.clearAt), needStop: !!p.needStop, noConflict: !!p.noConflict,
          trains: p.trains.map((x) => x.id), uncertain: !!p.uncertain,
          without: p.base ? { stopSec: Math.round(p.base.stopSec), passInSec: rel(p.base.passP) } : null,
          advice: p.best ? { kmh: p.best.kmh, passInSec: rel(p.best.passP), minKmh: p.best.minV != null ? Math.round(p.best.minV) : null, brakeStartM: p.brakeStartM } : null,
          savedSec: p.savedSec ?? 0, savedKWh: p.savedKWh ?? 0, keep: !!p.keep };
      },
      log(msg) { self.alog(String(msg).slice(0, 200)); },
    };
    // слой рекомендаций поверх команд: в режиме 'auto' поведение прежнее
    const raw = { hold: api.hold, release: api.release, limitSpeed: api.limitSpeed, reroute: api.reroute };
    this._touched = new Set();
    api.hold = (id, reason = 'решение ассистента', opt = {}) => {
      const tr = self.trainMap.get(id); if (!tr || tr.state === 'done') return false;
      const info = typeof reason === 'object' && reason ? reason : { reason: String(reason) };
      const safety = !!(opt.safety || info.safety);
      return self.recPropose('hold', tr, {}, info, () => raw.hold(id, info.reason || 'решение ассистента'), safety);
    };
    api.release = (id) => { self.recWithdraw('hold', id); return raw.release(id); };
    api.limitSpeed = (id, kmh, reason = '') => {
      const tr = self.trainMap.get(id); if (!tr || tr.state === 'done') return false;
      if (kmh == null) { self.recWithdraw('speed', id); return raw.limitSpeed(id, null); }
      const info = typeof reason === 'object' && reason ? reason : { reason: String(reason || '') };
      const k = Math.round(Math.max(10, Math.min(tr.ty.vmax, +kmh)));
      return self.recPropose('speed', tr, { kmh: k }, info, () => raw.limitSpeed(id, k, reason));
    };
    api.reroute = (id, nodes) => {
      const tr = self.trainMap.get(id); if (!tr) return false;
      if (self.approval === 'auto') { const ok = raw.reroute(id, nodes); if (ok) self.recRecord('route', tr, { nodes }, { reason: 'объезд' }); return ok; }
      return self.recPropose('route', tr, { nodes }, { reason: 'объезд закрытого перегона' }, () => raw.reroute(id, nodes));
    };
    state.recommendations = this.recs.filter((r) => this.t - r.createdAt < 1800).map((r) => ({ id: r.id, type: r.type, train: r.train, status: r.status, params: r.params }));
    const t0 = (typeof performance !== 'undefined' ? performance : Date).now();
    try {
      this.assistant(state, api);
    } catch (err) {
      this.m.errors++;
      this.alog('Ошибка в коде ассистента: ' + (err && err.message ? err.message : err), 'error');
    }
    this.recSweep();
    const dt = (typeof performance !== 'undefined' ? performance : Date).now() - t0;
    if (dt > 80) this.alog(`Ассистент думал ${Math.round(dt)} мс — это замедляет симуляцию`, 'error');
  }

  step(dt) {
    this.t += dt;
    if (this.assistant && this.t >= this.nextAssist) { this.runAssistant(); this.nextAssist = this.t + this.assistInterval; }
    const act = this.trains.filter((tr) => tr.state !== 'done' && tr.state !== 'invalid')
      .sort((a, b) => b.prio - a.prio || a.ord - b.ord);
    for (const tr of act) {
      if (tr.state === 'pending') this.trySpawn(tr);
      else this.advance(tr, dt);
    }
    if (this.t - this.lastDeadCheck >= 5) { this.lastDeadCheck = this.t; this.detectDeadlocks(); this.expireOrders(); }
    if (this.recs.length) this.recWatch();
    if (this.t - this.lastHist >= 30) { this.lastHist = this.t; this.record(); }
  }

  record() {
    const live = this.trains.filter((t) => t.state !== 'invalid' && (t.state !== 'pending' || this.t > t.dep));
    let sum = 0; for (const t of live) sum += this.liveDelay(t);
    this.m.hist.push({ t: this.t, avgDelay: live.length ? sum / live.length / 60 : 0, done: this.m.completed });
    if (this.m.hist.length > 2000) this.m.hist.splice(0, this.m.hist.length - 2000);
  }

  summary() {
    const valid = this.trains.filter((t) => t.state !== 'invalid');
    const live = valid.filter((t) => t.state !== 'pending' || this.t > t.dep);
    let sum = 0; for (const t of live) sum += this.liveDelay(t);
    let energy = 0; for (const t of valid) energy += t.energy;
    let wsum = 0, wd = 0;
    for (const t of live) { const w = t.ty.prio; wsum += w; wd += w * this.liveDelay(t); }
    const longStops = valid.filter((t) => t.waitSince != null && this.t - t.waitSince > 600 && t.state !== 'done').length;
    return {
      total: valid.length, completed: this.m.completed,
      running: valid.filter((t) => t.state === 'running' || t.state === 'dwell').length,
      avgDelay: live.length ? sum / live.length / 60 : 0, wDelay: wsum ? wd / wsum / 60 : 0, longStops,
      punctual: this.m.completed ? (this.m.onTime / this.m.completed) * 100 : null,
      deadlocks: this.m.deadlocks, stuck: valid.filter((t) => t.deadlock).length,
      unplanned: this.m.unplanned, energy, holds: this.m.holds, reroutes: this.m.reroutes, advices: this.m.advices, errors: this.m.errors,
      recs: (() => { const c = { proposed: 0, accepted: 0, rejected: 0, expired: 0, auto: 0, forecasts: 0, forecastOk: 0 };
        for (const r of this.recs) { if (r.safety) continue; if (r.auto) c.auto++; else c.proposed++;
          if (!r.auto && (r.status === 'active' || r.status === 'done')) c.accepted++; if (r.status === 'rejected') c.rejected++; if (r.status === 'expired') c.expired++;
          if (r.outcome && r.forecast) { c.forecasts++; if (r.outcome.stopped === r.forecast.stop) c.forecastOk++; } }
        return c; })(),
    };
  }
}

// ================= СЦЕНАРИИ =================
function mkStation(id, name, x, y, tracks = 2) { return { id, name, x, y, type: 'station', tracks }; }
function mkJunction(id, name, x, y) { return { id, name, x, y, type: 'junction', tracks: 1 }; }
function mkEdge(id, a, b, km, vmax, double) { return { id, a, b, len: km * 1000, vmax, double: !!double }; }
const hm = (h, m) => (h - 6) * 3600 + m * 60;

const DEMO_DEP = { express: hm(6, 0), freight: hm(6, 1), suburban: hm(6, 3) };
function serviceTrains(list) {
  const out = []; let n = 0;
  for (const g of list) {
    for (let i = 0; i < g.count; i++) {
      const num = g.num + i * (g.step || 2);
      out.push({ id: 'T' + (++n) + '_' + num, name: `№${num}`, type: g.type, from: g.from, to: g.to,
        dep: g.dep + i * g.every, stops: g.stops || (g.type === 'freight' || g.type === 'express' ? 'ends' : 'all') });
    }
  }
  return out;
}
